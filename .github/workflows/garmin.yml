name: Garmin Weekly Report

on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:

jobs:
  run-garmin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests

      - name: Fetch Garmin Data and Send Telegram Message
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          from datetime import date
          import requests
          from garminconnect import Garmin

          email = os.environ['GARMIN_EMAIL']
          password = os.environ['GARMIN_PASSWORD']
          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          try:
              client = Garmin(email, password)
              client.login()

              today = date.today()
              stats = client.get_user_summary(today.isoformat()) or {}
              
              try:
                  sleep = client.get_sleep_data(today.isoformat()) or {}
              except:
                  sleep = {}

              daily_sleep = sleep.get('dailySleepDTO', {}) or {}
              sleep_seconds = daily_sleep.get('sleepTimeSeconds')
              
              if sleep_seconds is not None:
                  sleep_duration = sleep_seconds // 3600
              else:
                  sleep_duration = "N/D"

              sleep_scores = daily_sleep.get('sleepScores', {}) or {}
              overall_score = sleep_scores.get('overall', {}) or {}
              sleep_score = overall_score.get('value', 'N/D')

              body_battery = stats.get('bodyBatteryMostRecentValue', 'N/D')
              stress_avg = stats.get('averageStressLevel', 'N/D')

              text = (
                  "📊 *Riepilogo Garmin Domenicale*\n\n"
                  f"💤 *Sonno:* {sleep_duration} ore (Punteggio: {sleep_score})\n"
                  f"🔋 *Body Battery:* {body_battery}\n"
                  f"🧘 *Stress Medio:* {stress_avg}\n\n"
                  "👉 Copia questo testo e incollalo nel check-in dell'agente!"
              )

              url = f"https://api.telegram.org/bot{token}/sendMessage"
              requests.post(url, json={"chat_id": chat_id, "text": text, "parse_mode": "Markdown"})
              print("Messaggio inviato con successo!")

          except Exception as e:
              print(f"Errore: {e}")
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              requests.post(url, json={"chat_id": chat_id, "text": f"Errore Garmin: {e}"})
          EOF
