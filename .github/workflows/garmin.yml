name: Garmin Weekly Report

on:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:

jobs:
  run-garmin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests

      - name: Fetch Garmin Data and Send Telegram Message
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          from datetime import date
          import requests
          from garminconnect import Garmin

          email = os.environ['GARMIN_EMAIL']
          password = os.environ['GARMIN_PASSWORD']
          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          try:
              client = Garmin(email, password)
              client.login()

              today_str = date.today().isoformat()
              
              # 1. Sommario Giornaliero (FC, Stress, Passi)
              user_summary = client.get_user_summary(today_str) or {}
              
              # Frequenza Cardiaca
              hr_rest = user_summary.get('restingHeartRate', 'N/D')
              hr_max = user_summary.get('maxHeartRate', 'N/D')
              
              # Stress & Body Battery
              stress_avg = user_summary.get('averageStressLevel')
              if stress_avg is None or stress_avg == -1:
                  stress_avg = "N/D"
                  
              body_battery = user_summary.get('bodyBatteryMostRecentValue', 'N/D')

              # 2. Sonno
              try:
                  sleep_data = client.get_sleep_data(today_str) or {}
                  daily_sleep = sleep_data.get('dailySleepDTO', {}) or {}
                  sleep_seconds = daily_sleep.get('sleepTimeSeconds')
                  sleep_duration = f"{sleep_seconds // 3600}h {(sleep_seconds % 3600) // 60}m" if sleep_seconds else "N/D"
                  sleep_score = daily_sleep.get('sleepScores', {}).get('overall', {}).get('value', 'N/D')
              except:
                  sleep_duration, sleep_score = "N/D", "N/D"

              # 3. Attività e Esercizio Fisico del giorno
              activities_text = ""
              try:
                  activities = client.get_activities_by_date(today_str, today_str, "") or []
                  if activities:
                      for act in activities:
                          name = act.get('activityName', 'Allenamento')
                          type_key = act.get('activityType', {}).get('typeKey', 'Sport')
                          duration_min = int(act.get('duration', 0) // 60)
                          avg_hr = act.get('averageHR', 'N/D')
                          calories = act.get('calories', 'N/D')
                          activities_text += f"• *{name}* ({type_key}): {duration_min} min | FC media: {avg_hr} bpm | {calories} kcal\n"
                  else:
                      activities_text = "Nessuna attività registrata oggi.\n"
              except Exception as e:
                  activities_text = "Impossibile recuperare le attività.\n"

              # Costruzione Messaggio Telegram
              text = (
                  "📊 *Riepilogo Garmin Domenicale*\n\n"
                  f"💤 *Sonno:* {sleep_duration} (Punteggio: {sleep_score})\n"
                  f"🔋 *Body Battery:* {body_battery}\n"
                  f"🧘 *Stress Medio:* {stress_avg}\n"
                  f"❤️ *Frequenza Cardiaca:* Riposo {hr_rest} bpm | Max {hr_max} bpm\n\n"
                  f"🏃‍♂️ *Attività Fisiche:*\n{activities_text}\n"
                  "👉 Copia questo testo e incollalo nel check-in dell'agente!"
              )

              url = f"https://api.telegram.org/bot{token}/sendMessage"
              requests.post(url, json={"chat_id": chat_id, "text": text, "parse_mode": "Markdown"})
              print("Messaggio inviato con successo!")

          except Exception as e:
              print(f"Errore: {e}")
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              requests.post(url, json={"chat_id": chat_id, "text": f"Errore Garmin: {e}"})
          EOF
